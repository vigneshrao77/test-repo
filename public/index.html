<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Form Demo</title>
    <style>
      :root {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-secondary: #4b5563;
        --color-secondary-hover: #374151;
        --color-emerald: #047857;
        --color-emerald-bg: #ecfdf5;
        --color-crimson: #b91c1c;
        --color-crimson-bg: #fef2f2;
        --color-ground: #f3f4f6;
        --color-surface: #ffffff;
        --color-text: #1f2937;
        --color-text-muted: #4b5563;
        --color-border: #d1d5db;
        --color-border-hover: #9ca3af;
        --color-border-subtle: #e5e7eb;
        --radius-sm: 6px;
        --radius-md: 12px;
        --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.07);
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      ::selection {
        background: var(--color-primary);
        color: #ffffff;
      }

      body {
        font-family: var(--font-sans);
        color: var(--color-text);
        background: var(--color-ground);
        max-width: 680px;
        margin: 0 auto;
        padding: 48px 20px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      input, button {
        caret-color: var(--color-primary);
      }

      main {
        background: var(--color-surface);
        padding: 36px 32px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.25;
        margin: 0 0 8px 0;
        color: var(--color-text);
      }

      .description {
        font-size: 1rem;
        color: var(--color-text-muted);
        line-height: 1.5;
        margin: 0 0 20px 0;
        max-width: 65ch;
      }

      .status {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        background: var(--color-ground);
        color: var(--color-text-muted);
        border: 1px solid var(--color-border-subtle);
        margin: 0 0 24px 0;
        letter-spacing: -0.01em;
        transition: all 0.2s ease;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color-border-hover);
        margin-right: 8px;
        flex-shrink: 0;
      }

      .status.connected {
        color: var(--color-emerald);
        background: var(--color-emerald-bg);
        border-color: rgba(4, 120, 87, 0.2);
      }

      .status.connected::before {
        background: var(--color-emerald);
        box-shadow: 0 0 0 2px rgba(4, 120, 87, 0.2);
      }

      .status.disconnected {
        color: var(--color-crimson);
        background: var(--color-crimson-bg);
        border-color: rgba(185, 28, 28, 0.2);
      }

      .status.disconnected::before {
        background: var(--color-crimson);
        box-shadow: 0 0 0 2px rgba(185, 28, 28, 0.2);
      }

      form {
        display: grid;
        gap: 18px;
      }

      .form-field {
        display: grid;
        gap: 6px;
      }

      label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-text);
        letter-spacing: -0.01em;
      }

      input {
        padding: 11px 14px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        font-family: var(--font-sans);
        font-size: 1rem;
        color: var(--color-text);
        background: var(--color-surface);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:hover {
        border-color: var(--color-border-hover);
      }

      input:focus-visible {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      button[type="submit"] {
        padding: 12px 20px;
        border: 0;
        border-radius: var(--radius-sm);
        color: #ffffff;
        background: var(--color-primary);
        font-family: var(--font-sans);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease, transform 0.1s ease;
        letter-spacing: -0.01em;
      }

      button[type="submit"]:hover {
        background: var(--color-primary-hover);
      }

      button[type="submit"]:active {
        transform: scale(0.99);
      }

      button[type="submit"]:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      .secondary {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        color: var(--color-secondary);
        background: var(--color-surface);
        font-family: var(--font-sans);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      .secondary:hover {
        background: var(--color-ground);
        color: var(--color-text);
        border-color: var(--color-border-hover);
      }

      .secondary:focus-visible {
        outline: 2px solid var(--color-secondary);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.001s !important;
        }
        button[type="submit"]:active {
          transform: none;
        }
        .status.connected::before,
        .status.disconnected::before {
          box-shadow: none;
        }
      }

      #message {
        min-height: 20px;
        margin: 16px 0 0 0;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: var(--radius-sm);
        transition: all 0.2s ease;
      }

      #message:empty {
        display: none;
      }

      #message.success {
        padding: 10px 14px;
        color: var(--color-emerald);
        background: var(--color-emerald-bg);
        border: 1px solid rgba(4, 120, 87, 0.15);
      }

      #message.error {
        padding: 10px 14px;
        color: var(--color-crimson);
        background: var(--color-crimson-bg);
        border: 1px solid rgba(185, 28, 28, 0.15);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 36px;
        margin-bottom: 14px;
        gap: 12px;
      }

      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.3;
        margin: 0;
        color: var(--color-text);
      }

      #user-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      #user-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        background: var(--color-ground);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        margin: 0;
        transition: border-color 0.15s ease;
      }

      #user-list li:hover {
        border-color: var(--color-border-hover);
      }

      .user-name {
        font-weight: 600;
        color: var(--color-text);
        word-break: break-word;
      }

      .user-email {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--color-text-muted);
        word-break: break-all;
      }

      .empty-state {
        color: var(--color-text-muted) !important;
        font-size: 0.875rem;
        justify-content: center !important;
        border-style: dashed !important;
        padding: 20px 16px !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>User Form Demo</h1>
      <p class="description">Submit a user, then confirm it appears below after being saved in the database.</p>
      <p id="database-status" class="status" role="status" aria-live="polite">Checking database connection...</p>
      <form id="user-form" aria-describedby="message">
        <div class="form-field">
          <label for="user-name">Name</label>
          <input id="user-name" name="name" maxlength="100" required autocomplete="name" placeholder="Full name" aria-required="true">
        </div>
        <div class="form-field">
          <label for="user-email">Email</label>
          <input id="user-email" name="email" type="email" required autocomplete="email" placeholder="user@example.com" aria-required="true">
        </div>
        <button type="submit">Save User</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <div class="section-header">
        <h2>Saved users</h2>
        <button id="refresh-button" class="secondary" type="button">Refresh saved users</button>
      </div>
      <ul id="user-list" aria-live="polite"><li>Loading...</li></ul>
    </main>
    <script>
      const form = document.querySelector("#user-form");
      const message = document.querySelector("#message");
      const userList = document.querySelector("#user-list");
      const databaseStatus = document.querySelector("#database-status");
      const refreshButton = document.querySelector("#refresh-button");

      function renderUsers(users) {
        userList.innerHTML = users.length
          ? users.map((user) => `<li class="user-item"><span class="user-name">${escapeHtml(user.name)}</span><span class="user-email">${escapeHtml(user.email)}</span></li>`).join("")
          : "<li class=\"empty-state\">No users yet.</li>";
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[character]));
      }

      async function loadUsers() {
        const response = await fetch("/api/users");
        if (!response.ok) throw new Error("Could not load users.");
        renderUsers(await response.json());
      }

      async function checkDatabase() {
        try {
          const response = await fetch("/api/health");
          const data = await response.json();
          if (!response.ok || !data.connected) {
            throw new Error(data.error || "Connection failed");
          }
          databaseStatus.className = "status connected";
          databaseStatus.textContent = data.provider === "supabase" ? "Supabase connected" : "Database connected";
        } catch (error) {
          databaseStatus.className = "status disconnected";
          databaseStatus.textContent = `Database disconnected (${error.message || "check configuration"})`;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        button.disabled = true;
        message.className = "";
        message.textContent = "";
        try {
          const response = await fetch("/api/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not save user.");
          message.className = "success";
          message.textContent = `Saved user: ${data.name} (${data.email})`;
          form.reset();
          await loadUsers();
        } catch (error) {
          message.className = "error";
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      refreshButton.addEventListener("click", () => {
        loadUsers().catch((error) => {
          message.className = "error";
          message.textContent = error.message;
        });
      });

      checkDatabase();
      loadUsers().catch((error) => {
        message.className = "error";
        message.textContent = error.message;
        userList.innerHTML = "";
      });
    </script>

</body>
</html>
